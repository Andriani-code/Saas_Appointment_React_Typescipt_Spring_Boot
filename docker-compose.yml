services:

  postgres:
    image: postgres:18
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: appointment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:

      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointment"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./appointment-backend
      dockerfile: Dockerfile.dev
    container_name: appointment_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: appointment
      DB_USERNAME: postgres
      DB_PASSWORD: password
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
    ports:
      - "8080:8080"
    volumes:
      - ./appointment-backend:/app
      - ~/.m2:/root/.m2
    working_dir: /app
    command: sh ./mvnw spring-boot:run
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./appointment-frontend
      dockerfile: Dockerfile.dev
    container_name: appointment_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /app
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    volumes:
      - ./appointment-frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
