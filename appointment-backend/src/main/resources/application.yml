spring:
  application:
    name: appointment-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appointment}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

jwt:
  # Obligatoire en production : générer avec `openssl rand -base64 64`
  # Défaut de dev pour que l'app tourne sans variable d'environnement.
  secret: ${JWT_SECRET:c2VjcmV0LWRldi1rZXktZm9yLWhpbGEtYXBwb2ludG1lbnQtMTIzNDU2Nzg5MGFiY2RlZg==}
  access-token-expiration: 900000       # 15 minutes
  refresh-token-expiration: 604800000   # 7 days

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_your_stripe_key_here}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

abstractapi:
  email:
    key: ${ABSTRACT_API_EMAIL_KEY:}

cloudflare:
  r2:
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET_NAME:}
    region: ${R2_REGION:auto}

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.app: INFO
    org.springframework.security: INFO
